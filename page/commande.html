        <div class="container-fluid row">

            <p class="text-secondary-emphasis text-center"> <br> <br> <br>
                Nous vous permetons d'accedée a tout nos plat juste en remplissant toutes les cases ci-dessous: 
            </p> <br> <br> <br>

        <div class="container" >

            <div >

                <form class="col-8 d-grid gap-2 col-6 mx-auto" action="" method="post" 
                style="background-color: #498edd; padding: 20px; border-radius: 10px;" 
                class="row justify-content-center align-items-center rounded-5">
                
                <div class="mb-3">
                    <label for="name" class="form-label">Nom</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">Téléphone</label>
                    <input type="tel" class="form-control" id="phone" name="phone" required>
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">Adresse de livraison</label>
                    <input type="text" class="form-control" id="address" name="address" required>
                </div>

                <div class="mb-3">
                    <label for="order_details" class="form-label">Détails de la commande</label>
                    <textarea class="form-control" id="order_details" name="order_details" rows="4" required></textarea>
                </div>

                <button type="submit" class="btn btn-secodary" class="btn-center">Passer la commande</button>
                <br> <br> <br><br> <br> <br>
            </form>
